<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neetprep Elite - Mock Test Series</title>
    <!-- CRITICAL: Linked tests.js so data loads properly -->
    <script src="tests.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #ffffff; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 18px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .logo span { color: #16a34a; }
        .btn-back { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; color: #334155; text-decoration: none; }
        .main-container { max-width: 850px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
        .page-title { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: #64748b; margin-bottom: 30px; }
        
        #testListContainer { display: flex; flex-direction: column; gap: 16px; }
        .test-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.01); transition: all 0.2s ease; gap: 20px; flex-wrap: wrap; }
        .test-card:hover { border-color: #86efac; box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.06); }
        .test-info h3 { font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .test-meta { display: flex; gap: 15px; font-size: 12.5px; color: #64748b; font-weight: 600; }
        .btn-take-test { background: #16a34a; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; transition: background 0.2s; white-space: nowrap; }
        .btn-take-test:hover { background: #15803d; }
        footer { text-align: center; padding: 25px; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; background: #ffffff; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Neetprep <span>Elite</span></div>
        <button class="btn-back" onclick="window.location.href='index.html'">🏠 Back to Home</button>
    </header>

    <div class="main-container">
        <h1 class="page-title">Available Mock Tests</h1>
        <p class="page-subtitle">Select an active NTA pattern test series to begin your assessment.</p>

        <!-- Dynamic Test List Injection Container -->
        <div id="testListContainer"></div>
    </div>

    <footer>&copy; 2026 Neetprep Elite. All rights reserved.</footer>

    <script>
        // Automatically load tests from tests.js
        window.onload = function() {
            let container = document.getElementById('testListContainer');
            container.innerHTML = "";

            if (typeof fullLengthTests === 'undefined' || Object.keys(fullLengthTests).length === 0) {
                container.innerHTML = "<p style='color:#64748b; font-size:14px;'>No mock tests available at the moment.</p>";
                return;
            }

            for (let testKey in fullLengthTests) {
                let test = fullLengthTests[testKey];
                let card = document.createElement('div');
                card.className = 'test-card';
                card.innerHTML = `
                    <div class="test-info">
                        <h3>${test.title}</h3>
                        <div class="test-meta">
                            <span>⏱️ ${Math.floor(test.durationMinutes / 60)} Hours ${test.durationMinutes % 60} Mins</span>
                            <span>📝 ${test.totalQuestions} Questions</span>
                            <span>🎯 Max Marks: ${test.totalQuestions * 4}</span>
                        </div>
                    </div>
                    <a href="test-instructions.html?test=${testKey}" class="btn-take-test">Take Test &rarr;</a>
                `;
                container.appendChild(card);
            }
        };
    </script>
</body>
</html>
