<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET CBT - Mock Test Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
        }
        h2 { color: #003366; text-align: center; margin-top: 0; font-size: 20px; }
        .test-card {
            background: #eef2f7;
            border: 1px solid #ccd6e0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-info h4 { margin: 0 0 5px 0; color: #003366; font-size: 15px; }
        .test-info p { margin: 0; font-size: 12px; color: #555; }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-rev { background-color: #6f42c1; color: white; }
        .btn-reattempt { background-color: #dc3545; color: white; margin-top: 5px; }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>NEET-UG CBT Portal</h2>
        
        <div class="section-title">Available Test Papers</div>
        <div id="tests-list-container"></div>
    </div>

    <script>
        window.onload = function() {
            renderTests();
        };

        function renderTests() {
            const container = document.getElementById('tests-list-container');
            container.innerHTML = "";

            const tests = [
                { id: "test1", name: "NEET Full Length Major Test 01" },
                { id: "test2", name: "NEET Full Length Major Test 02" }
            ];

            tests.forEach(test => {
                const isSubmitted = localStorage.getItem(`${test.id}_submitted`) === 'true';
                const score = localStorage.getItem(`${test.id}_final_score`) || 0;

                let card = document.createElement('div');
                card.className = "test-card";
                if(isSubmitted) card.style.borderLeft = "5px solid #28a745";

                card.innerHTML = `
                    <div class="test-info">
                        <h4>${test.name}</h4>
                        <p>${isSubmitted ? `Status: <b>Submitted</b> | Score: <b>${score} / 720</b>` : `180 Questions | 720 Marks | 3h 20m`}</p>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        ${isSubmitted ? `
                            <button class="btn btn-rev" onclick="openResult('${test.id}')">Scorecard</button>
                            <button class="btn btn-rev" style="background-color: #003366;" onclick="openReview('${test.id}')">Solutions</button>
                            <button class="btn btn-reattempt" onclick="reAttempt('${test.id}')">Re-Attempt</button>
                        ` : `
                            <button class="btn btn-start" onclick="startTest('${test.id}')">Take Test</button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startTest(testId) {
            let name = prompt("Enter your Full Name:", localStorage.getItem('neet_candidate_name') || "");
            if (!name) return;
            let roll = prompt("Enter your Roll Number / Application ID:", localStorage.getItem('neet_candidate_roll') || "");
            if (!roll) return;

            localStorage.setItem('neet_candidate_name', name.trim());
            localStorage.setItem('neet_candidate_roll', roll.trim());
            localStorage.setItem('active_test_id', testId);

            window.location.href = "exam.html";
        }

        function openResult(testId) {
            localStorage.setItem('active_test_id', testId);
            window.location.href = "result.html";
        }

        function openReview(testId) {
            localStorage.setItem('active_test_id', testId);
            window.location.href = "review.html";
        }

        function reAttempt(testId) {
            if (confirm(`Clear history and re-attempt ${testId.toUpperCase()}?`)) {
                localStorage.removeItem(`${testId}_submitted`);
                localStorage.removeItem(`${testId}_final_score`);
                localStorage.removeItem(`${testId}_user_answers`);
                localStorage.removeItem(`${testId}_sub_scores`);
                renderTests();
            }
        }
    </script>
</body>
</html>
