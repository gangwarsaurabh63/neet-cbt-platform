<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neetprep Elite - NEET CBT & Practice Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; }

        /* Splash Screen / Intro Animation Overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.8s ease 2.2s forwards;
        }

        .splash-logo {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            animation: scaleUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .splash-logo span {
            color: #22c55e;
        }

        .splash-tagline {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.6s forwards;
        }

        .loader-bar {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #22c55e;
            animation: loadProgress 1.5s ease 0.4s forwards;
        }

        @keyframes scaleUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes loadProgress {
            0% { left: -100%; }
            100% { left: 0; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* Main Website Dashboard Styles */
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 { color: #0f172a; font-size: 28px; }
        p { color: #64748b; }
        .btn-start {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-start:hover { background: #15803d; }
    </style>
</head>
<body>

    <!-- Splash Screen Animation -->
    <div id="splash-screen">
        <div class="splash-logo">⚡ Neetprep <span>Elite</span></div>
        <div class="splash-tagline">Your Ultimate NEET Preparation Portal</div>
        <div class="loader-bar"></div>
    </div>

    <!-- Main Home Page Content -->
    <div class="container">
        <h1>Welcome to Neetprep Elite</h1>
        <p>Master your NEET UG preparation with NTA-style CBT mock tests and smart chapter-wise practice.</p>
        <button class="btn-start" onclick="window.location.href='practice.html'">🚀 Start Practicing Now</button>
    </div>

    <script>
        // Automatically hide splash screen layer completely after animation finishes
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
