<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Session - NEET CBT Portal</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }

        header { background: #ffffff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 15px; font-weight: bold; color: #16a34a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
        .header-actions { display: flex; gap: 10px; }
        .btn-action { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .layout { max-width: 800px; margin: 25px auto; width: 100%; padding: 0 15px; flex: 1; display: flex; flex-direction: column; }

        /* Question Container */
        .content { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.02); word-break: break-word; flex: 1; }
        
        .q-header { display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .pyq-badge { display: none; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-top: 4px; width: fit-content; border: 1px solid #fca5a5; }

        .q-text { font-size: 16px; line-height: 1.6; color: #0f172a; margin-bottom: 20px; font-weight: 500; }

        .options-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .options-list li { margin-bottom: 12px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 14px; background: #fff; transition: background 0.2s; }
        .options-list li:hover { background: #f8fafc; }
        .options-list li.correct-ans { background: #f0fdf4 !important; border-color: #22c55e; color: #166534; font-weight: bold; }
        .options-list li.wrong-ans { background: #fef2f2 !important; border-color: #ef4444; color: #991b1b; }

        .solution-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 4px solid #22c55e; padding: 14px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #166534; display: none; line-height: 1.5; }
        
        .footer-nav { display: flex; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 15px; gap: 10px; }
        .btn-nav { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">📖 <span id="nav-chapter-title">Chapter</span></div>
        <div class="header-actions">
            <button class="btn-action" onclick="window.location.href='practice.html'">⬅ Change Chapter</button>
            <button class="btn-action" onclick="window.location.href='index.html'">🏠 Dashboard</button>
        </div>
    </header>

    <div class="layout">
        <div class="content" id="questionContainer">
            <div>
                <div class="q-header">
                    <div>
                        <span id="q-sub-title" style="display:block; font-size:12px; color:#64748b;">Subject</span>
                        <div id="pyq-badge" class="pyq-badge">🔥 Previous Year Question</div>
                    </div>
                    <span id="q-counter">Question 0 of 0</span>
                </div>

                <div class="q-text" id="q-text">Loading question...</div>

                <ul class="options-list" id="options-container">
                    <li id="opt0"></li>
                    <li id="opt1"></li>
                    <li id="opt2"></li>
                    <li id="opt3"></li>
                </ul>

                <div class="solution-box" id="solutionBox">
                    <strong>Explanation:</strong><br><span id="q-explanation"></span>
                </div>
            </div>

            <div class="footer-nav">
                <button class="btn-nav" style="background:#64748b;" onclick="prevQ()">◄ Previous</button>
                <button class="btn-nav" onclick="nextQ()">Next ►</button>
            </div>
        </div>
    </div>

    <script>
        const selectedSubject = localStorage.getItem('active_practice_subject') || 'Physics';
        const selectedChapter = localStorage.getItem('active_practice_chapter') || '';

        document.getElementById('nav-chapter-title').textContent = selectedChapter || 'Practice Hub';
        document.getElementById('q-sub-title').textContent = `Subject: ${selectedSubject} | Chapter: ${selectedChapter}`;

        let chaptersData = (typeof chapterwisePracticeBank !== 'undefined' && chapterwisePracticeBank[selectedSubject]) ? chapterwisePracticeBank[selectedSubject] : {};
        let currentQuestions = chaptersData[selectedChapter] || [];
        
        // Load saved index if available in local storage
        let storageKey = `neet_practice_progress_${selectedSubject}_${selectedChapter}`;
        let savedIndex = localStorage.getItem(storageKey);
        let currentIndex = savedIndex ? parseInt(savedIndex) : 0;
        let answeredState = false;

        function savePracticeProgress() {
            localStorage.setItem(storageKey, currentIndex);
        }

        function loadPracticeQuestion() {
            if (currentQuestions.length === 0) {
                document.getElementById('q-text').textContent = "No questions found for this chapter yet.";
                document.getElementById('options-container').innerHTML = "";
                document.getElementById('q-counter').textContent = "0 of 0";
                return;
            }

            if (currentIndex >= currentQuestions.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentQuestions.length - 1;

            // Save state whenever question is loaded
            savePracticeProgress();

            let q = currentQuestions[currentIndex];
            document.getElementById('q-counter').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            document.getElementById('q-text').innerHTML = q.q;

            let pyqBadge = document.getElementById('pyq-badge');
            if (q.pyqYear) {
                pyqBadge.textContent = `🔥 Previous Year Question (${q.pyqYear})`;
                pyqBadge.style.display = 'block';
            } else {
                pyqBadge.style.display = 'none';
            }

            let optList = document.getElementById('options-container');
            optList.innerHTML = "";
            answeredState = false;
            document.getElementById('solutionBox').style.display = "none";

            q.options.forEach((optText, i) => {
                let li = document.createElement('li');
                li.id = `opt${i}`;
                li.textContent = optText;
                li.onclick = () => checkAnswer(i, q.correct);
                optList.appendChild(li);
            });
        }

        function checkAnswer(selectedIdx, correctIdx) {
            if (answeredState) return;
            answeredState = true;

            for (let i = 0; i < 4; i++) {
                let li = document.getElementById(`opt${i}`);
                if (i === correctIdx) li.classList.add('correct-ans');
                else if (i === selectedIdx) li.classList.add('wrong-ans');
            }

            document.getElementById('q-explanation').textContent = currentQuestions[currentIndex].explanation || "Detailed solution available.";
            document.getElementById('solutionBox').style.display = "block";
        }

        function nextQ() { currentIndex++; loadPracticeQuestion(); }
        function prevQ() { currentIndex--; loadPracticeQuestion(); }

        loadPracticeQuestion();
    </script>
</body>
</html>
