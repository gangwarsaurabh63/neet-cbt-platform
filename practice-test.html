<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Session - NEET CBT Portal</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }

        header { background: #ffffff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 15px; font-weight: bold; color: #16a34a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-action { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-bookmark { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .btn-bookmark.bookmarked { background: #dbeafe; color: #1e3a8a; border-color: #3b82f6; font-weight: bold; }

        .layout { max-width: 800px; margin: 25px auto; width: 100%; padding: 0 15px; flex: 1; display: flex; flex-direction: column; gap: 20px; }

        /* Question Container */
        .content { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.02); word-break: break-word; }
        
        .q-header { display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .pyq-badge { display: none; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-top: 4px; width: fit-content; border: 1px solid #fca5a5; }

        .q-text { font-size: 16px; line-height: 1.6; color: #0f172a; margin-bottom: 20px; font-weight: 500; }

        .options-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .options-list li { margin-bottom: 12px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 14px; background: #fff; transition: background 0.2s; }
        .options-list li:hover { background: #f8fafc; }
        .options-list li.correct-ans { background: #f0fdf4 !important; border-color: #22c55e; color: #166534; font-weight: bold; }
        .options-list li.wrong-ans { background: #fef2f2 !important; border-color: #ef4444; color: #991b1b; }

        .solution-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 4px solid #22c55e; padding: 14px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #166534; display: none; line-height: 1.5; }
        
        .footer-nav { display: flex; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 15px; gap: 10px; margin-top: 20px; }
        .btn-nav { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }

        /* Question Palette Grid (NEETprep Style) */
        .palette-container { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .palette-title { font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 8px; max-height: 160px; overflow-y: auto; padding-right: 4px; }
        .palette-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; height: 38px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .palette-btn:hover { background: #e2e8f0; }
        .palette-btn.active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
        .palette-btn.attempted { background: #dcfce7; border-color: #22c55e; color: #166534; }
    </style>
</head>
<body>

    <header>
        <div class="logo">📖 <span id="nav-chapter-title">Chapter</span></div>
        <div class="header-actions">
            <button id="bookmarkBtn" class="btn-action btn-bookmark" onclick="toggleBookmark()">🔖 Bookmark</button>
            <button class="btn-action" onclick="window.location.href='practice.html'">⬅ Chapters</button>
            <button class="btn-action" onclick="window.location.href='index.html'">🏠 Home</button>
        </div>
    </header>

    <div class="layout">
        <!-- Question Main Card -->
        <div class="content" id="questionContainer">
            <div>
                <div class="q-header">
                    <div>
                        <span id="q-sub-title" style="display:block; font-size:12px; color:#64748b;">Subject</span>
                        <div id="pyq-badge" class="pyq-badge">🔥 Previous Year Question</div>
                    </div>
                    <span id="q-counter">Question 0 of 0</span>
                </div>

                <div class="q-text" id="q-text">Loading question...</div>

                <ul class="options-list" id="options-container">
                    <li id="opt0"></li>
                    <li id="opt1"></li>
                    <li id="opt2"></li>
                    <li id="opt3"></li>
                </ul>

                <div class="solution-box" id="solutionBox">
                    <strong>Explanation:</strong><br><span id="q-explanation"></span>
                </div>
            </div>

            <div class="footer-nav">
                <button class="btn-nav" style="background:#64748b;" onclick="prevQ()">◄ Previous</button>
                <button class="btn-nav" onclick="nextQ()">Next ►</button>
            </div>
        </div>

        <!-- NEETprep Style Question Palette / Jump Grid -->
        <div class="palette-container">
            <div class="palette-title">Question Navigator</div>
            <div class="palette-grid" id="paletteGrid"></div>
        </div>
    </div>

    <script>
        const selectedSubject = localStorage.getItem('active_practice_subject') || 'Physics';
        const selectedChapter = localStorage.getItem('active_practice_chapter') || '';

        document.getElementById('nav-chapter-title').textContent = selectedChapter || 'Practice Hub';
        document.getElementById('q-sub-title').textContent = `Subject: ${selectedSubject} | Chapter: ${selectedChapter}`;

        let chaptersData = (typeof chapterwisePracticeBank !== 'undefined' && chapterwisePracticeBank[selectedSubject]) ? chapterwisePracticeBank[selectedSubject] : {};
        let currentQuestions = chaptersData[selectedChapter] || [];
        
        let progressStorageKey = `neet_practice_progress_${selectedSubject}_${selectedChapter}`;
        let savedIndex = localStorage.getItem(progressStorageKey);
        let currentIndex = savedIndex ? parseInt(savedIndex) : 0;

        let attemptsStorageKey = `neet_practice_attempts_${selectedSubject}_${selectedChapter}`;
        let bookmarkStorageKey = `neet_bookmarks_${selectedSubject}_${selectedChapter}`;

        function getAttempts() {
            let data = localStorage.getItem(attemptsStorageKey);
            return data ? JSON.parse(data) : {};
        }

        function saveAttempt(qIndex, selectedIdx) {
            let attempts = getAttempts();
            attempts[qIndex] = { selectedIdx: selectedIdx };
            localStorage.setItem(attemptsStorageKey, JSON.stringify(attempts));
            buildQuestionPalette(); // Refresh palette coloring
        }

        function getBookmarks() {
            let bookmarks = localStorage.getItem(bookmarkStorageKey);
            return bookmarks ? JSON.parse(bookmarks) : [];
        }

        function toggleBookmark() {
            let bookmarks = getBookmarks();
            let indexInBookmarks = bookmarks.indexOf(currentIndex);
            if (indexInBookmarks > -1) {
                bookmarks.splice(indexInBookmarks, 1);
                alert("Bookmark removed!");
            } else {
                bookmarks.push(currentIndex);
                alert("Question bookmarked successfully!");
            }
            localStorage.setItem(bookmarkStorageKey, JSON.stringify(bookmarks));
            updateBookmarkButtonUI();
        }

        function updateBookmarkButtonUI() {
            let bookmarks = getBookmarks();
            let btn = document.getElementById('bookmarkBtn');
            if (bookmarks.includes(currentIndex)) {
                btn.classList.add('bookmarked');
                btn.textContent = "🔖 Bookmarked";
            } else {
                btn.classList.remove('bookmarked');
                btn.textContent = "🔖 Bookmark";
            }
        }

        function buildQuestionPalette() {
            let grid = document.getElementById('paletteGrid');
            grid.innerHTML = "";
            let attempts = getAttempts();

            currentQuestions.forEach((_, idx) => {
                let btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = idx + 1;

                if (idx === currentIndex) {
                    btn.classList.add('active');
                }
                if (attempts[idx] !== undefined) {
                    btn.classList.add('attempted');
                }

                btn.onclick = () => jumpToQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            loadPracticeQuestion();
        }

        function loadPracticeQuestion() {
            if (currentQuestions.length === 0) {
                document.getElementById('q-text').textContent = "No questions found for this chapter yet.";
                document.getElementById('options-container').innerHTML = "";
                document.getElementById('q-counter').textContent = "0 of 0";
                document.getElementById('bookmarkBtn').style.display = 'none';
                document.getElementById('paletteGrid').innerHTML = "";
                return;
            }

            if (currentIndex >= currentQuestions.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentQuestions.length - 1;

            localStorage.setItem(progressStorageKey, currentIndex);
            updateBookmarkButtonUI();
            buildQuestionPalette();

            let q = currentQuestions[currentIndex];
            document.getElementById('q-counter').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            document.getElementById('q-text').innerHTML = q.q;

            let pyqBadge = document.getElementById('pyq-badge');
            if (q.pyqYear) {
                pyqBadge.textContent = `🔥 Previous Year Question (${q.pyqYear})`;
                pyqBadge.style.display = 'block';
            } else {
                pyqBadge.style.display = 'none';
            }

            let optList = document.getElementById('options-container');
            optList.innerHTML = "";
            document.getElementById('solutionBox').style.display = "none";

            q.options.forEach((optText, i) => {
                let li = document.createElement('li');
                li.id = `opt${i}`;
                li.textContent = optText;
                li.onclick = () => checkAnswer(i, q.correct);
                optList.appendChild(li);
            });

            let attempts = getAttempts();
            if (attempts[currentIndex] !== undefined) {
                applyAttemptState(attempts[currentIndex].selectedIdx, q.correct);
            }
        }

        function checkAnswer(selectedIdx, correctIdx) {
            let attempts = getAttempts();
            if (attempts[currentIndex] !== undefined) return; 

            saveAttempt(currentIndex, selectedIdx);
            applyAttemptState(selectedIdx, correctIdx);
        }

        function applyAttemptState(selectedIdx, correctIdx) {
            for (let i = 0; i < 4; i++) {
                let li = document.getElementById(`opt${i}`);
                if (i === correctIdx) li.classList.add('correct-ans');
                else if (i === selectedIdx) li.classList.add('wrong-ans');
            }

            document.getElementById('q-explanation').textContent = currentQuestions[currentIndex].explanation || "Detailed solution available.";
            document.getElementById('solutionBox').style.display = "block";
        }

        function nextQ() { 
            currentIndex++; 
            loadPracticeQuestion(); 
        }

        function prevQ() { 
            currentIndex--; 
            loadPracticeQuestion(); 
        }

        loadPracticeQuestion();
    </script>
</body>
</html>
