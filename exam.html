<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET CBT - Online Exam Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-box {
            background: #fff;
            color: #333;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .question-area {
            flex: 3;
            background: white;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .sidebar {
            flex: 1;
            background: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .options-list li {
            margin-bottom: 12px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .options-list li:hover {
            background-color: #f0f8ff;
            border-color: #0056b3;
        }
        .footer-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .btn-review { background-color: #6f42c1; color: white; }
    </style>
</head>
<body>

    <header>
        <h2>NEET Mock Test (NTA Mode)</h2>
        <div class="timer-box">Time Left: <span id="timer">03:00:00</span></div>
    </header>

    <div class="main-container">
        <div class="question-area">
            <h3>Question 1 of 45 (Physics)</h3>
            <p>What is the dimensional formula of the universal gravitational constant?</p>
            
            <ul class="options-list">
                <li><input type="radio" name="opt" id="o1"> M⁻¹ L³ T⁻²</li>
                <li><input type="radio" name="opt" id="o2"> M L² T⁻²</li>
                <li><input type="radio" name="opt" id="o3"> M⁻¹ L² T⁻²</li>
                <li><input type="radio" name="opt" id="o4"> M L³ T⁻²</li>
            </ul>

            <div class="footer-buttons">
                <button class="btn-save">Save & Next</button>
                <button class="btn-clear">Clear Response</button>
                <button class="btn-review">Save & Mark for Review</button>
            </div>
        </div>

        <div class="sidebar">
            <h4>Question Palette</h4>
            <p>Candidate: Saurabh Gangwar</p>
            <!-- Quick palette layout placeholder -->
            <div style="display: grid; grid-template-columns: repeat(4, 40px); gap: 8px; margin-top: 15px;">
                <button style="background: #28a745; color: white;">1</button>
                <button style="background: #e0e0e0;">2</button>
                <button style="background: #e0e0e0;">3</button>
                <button style="background: #e0e0e0;">4</button>
            </div>
        </div>
    </div>

    <script>
        // Simple Countdown Timer Script
        let timeRemaining = 10800; // 3 hours in seconds
        const timerElement = document.getElementById('timer');

        setInterval(() => {
            let hours = Math.floor(timeRemaining / 3600);
            let minutes = Math.floor((timeRemaining % 3600) / 60);
            let seconds = timeRemaining % 60;

            timerElement.textContent = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');

            if (timeRemaining > 0) {
                timeRemaining--;
            }
        }, 1000);
    </script>

</body>
</html>
