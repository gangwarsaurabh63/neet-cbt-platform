<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET CBT - Official NTA Mode</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 { font-size: 16px; margin: 0; }
        .timer-box {
            background: #fff;
            color: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }
        .question-area {
            flex: 3;
            background: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .sidebar {
            flex: 1.3;
            background: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        .options-list li {
            margin-bottom: 10px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .options-list li:hover {
            background-color: #f0f8ff;
            border-color: #003366;
        }
        .footer-buttons {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-review-next { background-color: #6f42c1; color: white; }
        .btn-save-review { background-color: #007bff; color: white; }
        .btn-clear { background-color: #e0e0e0; color: #333; }
        .btn-submit { background-color: #dc3545; color: white; width: 100%; margin-top: 20px; padding: 12px; font-size: 14px; }

        /* NTA Palette Button Shapes & Colors */
        .pal-btn {
            width: 35px;
            height: 35px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #e0e0e0;
            color: #000;
        }

        /* Status legend */
        .legend-box { font-size: 11px; display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .question-area { flex: none; height: 58vh; border-right: none; border-bottom: 2px solid #ddd; }
            .sidebar { flex: none; height: 42vh; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <header>
        <h2>NEET Mock Test (NTA CBT Mode)</h2>
        <div class="timer-box">Time Left: <span id="timer">03:00:00</span></div>
    </header>

    <div class="main-container">
        <div class="question-area" id="question-box">
            <h3 id="q-title" style="font-size: 15px; margin-top: 0;">Question 1 of 4</h3>
            <p id="q-text" style="font-size: 14px; line-height: 1.5;"></p>
            
            <ul class="options-list" id="options-container">
                <li onclick="selectOpt(0)"><input type="radio" name="opt" id="r0"> <span id="opt0"></span></li>
                <li onclick="selectOpt(1)"><input type="radio" name="opt" id="r1"> <span id="opt1"></span></li>
                <li onclick="selectOpt(2)"><input type="radio" name="opt" id="r2"> <span id="opt2"></span></li>
                <li onclick="selectOpt(3)"><input type="radio" name="opt" id="r3"> <span id="opt3"></span></li>
            </ul>

            <div class="footer-buttons">
                <button class="btn-save" onclick="saveAndNext()">Save & Next</button>
                <button class="btn-review-next" onclick="markAndNext()">Mark for Review & Next</button>
                <button class="btn-save-review" onclick="saveAndMark()">Save & Mark for Review</button>
                <button class="btn-clear" onclick="clearResponse()">Clear</button>
            </div>
        </div>

        <div class="sidebar">
            <h4 style="margin: 0 0 3px 0; font-size: 13px;">Question Palette</h4>
            <p style="font-size: 11px; color: #555; margin: 0 0 10px 0;">Candidate: Saurabh Gangwar</p>
            
            <div style="display: grid; grid-template-columns: repeat(4, 38px); gap: 6px;" id="palette">
                <!-- Dynamically generated palette buttons -->
            </div>

            <button class="btn-submit" onclick="submitTest()">Submit Test</button>

            <div class="legend-box">
                <div class="legend-item"><span class="dot" style="background: #28a745;"></span> Answered</div>
                <div class="legend-item"><span class="dot" style="background: #dc3545;"></span> Not Answered</div>
                <div class="legend-item"><span class="dot" style="background: #6f42c1;"></span> Marked for Review</div>
                <div class="legend-item"><span class="dot" style="background: #e0e0e0;"></span> Not Visited</div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "What is the dimensional formula of the universal gravitational constant?",
                options: ["M⁻¹ L³ T⁻²", "M L² T⁻²", "M⁻¹ L² T⁻²", "M L³ T⁻²"],
                correct: 0
            },
            {
                q: "Which of the following units is fundamentally used to measure luminous intensity?",
                options: ["Mole", "Candela", "Kelvin", "Ampere"],
                correct: 1
            },
            {
                q: "The escape velocity of a body from the earth's surface depends on:",
                options: ["Mass of the body", "Angle of projection", "Mass and radius of the earth", "Mass of the body only"],
                correct: 2
            },
            {
                q: "Which law states that the total magnetic flux linked with a closed surface is zero?",
                options: ["Gauss's Law for Magnetism", "Faraday's Law", "Ampere's Circuital Law", "Coulomb's Law"],
                correct: 0
            }
        ];

        let currentQ = 0;
        let statuses = Array(questions.length).fill("not-visited"); // not-visited, answered, not-answered, review
        let answers = {};

        function initPalette() {
            const paletteDiv = document.getElementById('palette');
            paletteDiv.innerHTML = "";
            questions.forEach((_, idx) => {
                let btn = document.createElement('button');
                btn.className = "pal-btn";
                btn.id = `pal-${idx}`;
                btn.textContent = idx + 1;
                btn.onclick = () => jumpTo(idx);
                paletteDiv.appendChild(btn);
            });
            updatePaletteColors();
        }

        function updatePaletteColors() {
            questions.forEach((_, idx) => {
                let btn = document.getElementById(`pal-${idx}`);
                let status = statuses[idx];
                
                // NTA Color Mapping
                if (status === "answered") {
                    btn.style.background = "#28a745"; btn.style.color = "white";
                } else if (status === "not-answered") {
                    btn.style.background = "#dc3545"; btn.style.color = "white";
                } else if (status === "review") {
                    btn.style.background = "#6f42c1"; btn.style.color = "white";
                } else {
                    btn.style.background = "#e0e0e0"; btn.style.color = "black";
                }
            });
        }

        function loadQuestion(index) {
            currentQ = index;
            if (statuses[index] === "not-visited") {
                statuses[index] = "not-answered";
            }
            
            document.getElementById('q-title').textContent = `Question ${index + 1} of ${questions.length}`;
            document.getElementById('q-text').textContent = questions[index].q;
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt${i}`).textContent = questions[index].options[i];
                document.getElementById(`r${i}`).checked = (answers[index] === i);
            }
            updatePaletteColors();
        }

        function selectOpt(optIndex) {
            document.getElementById(`r${optIndex}`).checked = true;
            answers[currentQ] = optIndex;
        }

        function saveAndNext() {
            if (answers[currentQ] !== undefined) {
                statuses[currentQ] = "answered";
            } else {
                statuses[currentQ] = "not-answered";
            }
            moveToNext();
        }

        function markAndNext() {
            statuses[currentQ] = "review";
            moveToNext();
        }

        function saveAndMark() {
            if (answers[currentQ] !== undefined) {
                statuses[currentQ] = "review"; // Saved & marked for review
            } else {
                statuses[currentQ] = "not-answered";
            }
            moveToNext();
        }

        function clearResponse() {
            delete answers[currentQ];
            for (let i = 0; i < 4; i++) document.getElementById(`r${i}`).checked = false;
            statuses[currentQ] = "not-answered";
            updatePaletteColors();
        }

        function moveToNext() {
            if (currentQ < questions.length - 1) {
                loadQuestion(currentQ + 1);
            } else {
                updatePaletteColors();
                alert("This is the last question.");
            }
        }

        function jumpTo(index) {
            loadQuestion(index);
        }

        function submitTest() {
            if (confirm("Are you sure you want to submit the test?")) {
                let score = 0;
                let attempted = 0;
                
                questions.forEach((q, idx) => {
                    if (answers[idx] !== undefined) {
                        attempted++;
                        if (answers[idx] === q.correct) score += 4;
                        else score -= 1; // NEET Negative Marking
                    }
                });

                // Add this line to redirect to your scorecard page:
                window.location.href = `result.html?score=${score}&max=${questions.length * 4}&attempted=${attempted}`;
            }
        }

                `;
            }
        }

        // Initialize on load
        initPalette();
        loadQuestion(0);

        // Timer
        let timeRemaining = 10800;
        const timerElement = document.getElementById('timer');
        setInterval(() => {
            let hours = Math.floor(timeRemaining / 3600);
            let minutes = Math.floor((timeRemaining % 3600) / 60);
            let seconds = timeRemaining % 60;
            timerElement.textContent = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            if (timeRemaining > 0) timeRemaining--;
        }, 1000);
    </script>

</body>
</html>
