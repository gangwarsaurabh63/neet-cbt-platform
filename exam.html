   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET CBT - Online Exam Interface</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 { font-size: 16px; margin: 0; }
        .timer-box {
            background: #fff;
            color: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }
        .question-area {
            flex: 3;
            background: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .sidebar {
            flex: 1.2;
            background: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        .options-list li {
            margin-bottom: 10px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .options-list li:hover {
            background-color: #f0f8ff;
            border-color: #0056b3;
        }
        .footer-buttons {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-clear { background-color: #ffc107; color: #333; }
        .btn-review { background-color: #6f42c1; color: white; }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .question-area {
                flex: none;
                height: 65vh;
                border-right: none;
                border-bottom: 2px solid #ddd;
            }
            .sidebar {
                flex: none;
                height: 35vh;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>NEET Mock Test</h2>
        <div class="timer-box">Time: <span id="timer">03:00:00</span></div>
    </header>

    <div class="main-container">
        <div class="question-area">
            <h3 style="font-size: 15px; margin-top: 0;">Question 1 of 45 (Physics)</h3>
            <p style="font-size: 14px; line-height: 1.5;">What is the dimensional formula of the universal gravitational constant?</p>
            
            <ul class="options-list">
                <li><input type="radio" name="opt"> M⁻¹ L³ T⁻²</li>
                <li><input type="radio" name="opt"> M L² T⁻²</li>
                <li><input type="radio" name="opt"> M⁻¹ L² T⁻²</li>
                <li><input type="radio" name="opt"> M L³ T⁻²</li>
            </ul>

            <div class="footer-buttons">
                <button class="btn-save">Save & Next</button>
                <button class="btn-clear">Clear</button>
                <button class="btn-review">Mark for Review</button>
            </div>
        </div>

        <div class="sidebar">
            <h4 style="margin: 0 0 5px 0; font-size: 14px;">Question Palette</h4>
            <p style="font-size: 12px; color: #555; margin: 0 0 10px 0;">Candidate: Saurabh Gangwar</p>
            <div style="display: grid; grid-template-columns: repeat(4, 35px); gap: 6px;">
                <button style="background: #28a745; color: white; height: 35px;">1</button>
                <button style="background: #e0e0e0; height: 35px;">2</button>
                <button style="background: #e0e0e0; height: 35px;">3</button>
                <button style="background: #e0e0e0; height: 35px;">4</button>
            </div>
        </div>
    </div>

    <script>
        let timeRemaining = 10800;
        const timerElement = document.getElementById('timer');

        setInterval(() => {
            let hours = Math.floor(timeRemaining / 3600);
            let minutes = Math.floor((timeRemaining % 3600) / 60);
            let seconds = timeRemaining % 60;

            timerElement.textContent = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');

            if (timeRemaining > 0) {
                timeRemaining--;
            }
        }, 1000);
    </script>

</body>
</html>
