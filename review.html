<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Review & Explanations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #003366; text-align: center; margin-top: 0; }
        .q-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .q-card.correct { border-left: 5px solid #28a745; }
        .q-card.incorrect { border-left: 5px solid #dc3545; }
        .q-card.unattempted { border-left: 5px solid #ffc107; }
        
        .explanation {
            background: #e8f4fd;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 13px;
            color: #0c5460;
        }
        .btn-back {
            background-color: #003366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Question Solutions & Explanations</h2>
        <div id="review-container"></div>
        <button class="btn-back" onclick="window.location.href='result.html'">Back to Scorecard</button>
    </div>

    <script src="questions.js"></script>
    <script>
        const userAnswers = JSON.parse(localStorage.getItem('neet_user_answers')) || {};
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = "";

        if (typeof neetQuestions !== 'undefined') {
            neetQuestions.forEach((q, idx) => {
                let userAns = userAnswers[idx];
                let statusClass = "unattempted";
                let statusText = "Not Attempted";

                if (userAns !== undefined) {
                    if (userAns === q.correct) {
                        statusClass = "correct";
                        statusText = "Correct (+4)";
                    } else {
                        statusClass = "incorrect";
                        statusText = "Incorrect (-1)";
                    }
                }

                let card = document.createElement('div');
                card.className = `q-card ${statusClass}`;
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px;">
                        <span>Q${idx + 1} [${q.subject || "General"}]</span>
                        <span style="color: ${userAns === q.correct ? '#28a745' : (userAns !== undefined ? '#dc3545' : '#ffc107')}">${statusText}</span>
                    </div>
                    <p style="margin: 5px 0;">${q.q}</p>
                    <ul style="margin: 5px 0; padding-left: 20px; font-size: 13px;">
                        <li>Your Answer: <b>${userAns !== undefined ? q.options[userAns] : "None"}</b></li>
                        <li>Correct Answer: <b>${q.options[q.correct]}</b></li>
                    </ul>
                    <div class="explanation">
                        <strong>Explanation:</strong> ${q.explanation || "Detailed solution will be updated soon."}
                    </div>
                `;
                reviewContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
