<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter-wise Practice Hub</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }

        header { background: #ffffff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 16px; font-weight: bold; color: #16a34a; }
        .btn-home { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .layout { display: flex; flex: 1; max-width: 1100px; margin: 20px auto; width: 100%; gap: 20px; padding: 0 15px; }

        .sidebar { width: 280px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; height: fit-content; }
        .sidebar h3 { font-size: 14px; margin-top: 0; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .chapter-btn { width: 100%; text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: #334155; }
        .chapter-btn:hover, .chapter-btn.active { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }

        .content { flex: 1; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .q-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .q-text { font-size: 14px; line-height: 1.6; color: #0f172a; margin-bottom: 20px; font-weight: 500; }

        .options-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .options-list li { margin-bottom: 8px; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px; background: #fff; transition: background 0.2s; }
        .options-list li:hover { background: #f8fafc; }
        .options-list li.correct-ans { background: #f0fdf4 !important; border-color: #22c55e; color: #166534; font-weight: bold; }
        .options-list li.wrong-ans { background: #fef2f2 !important; border-color: #ef4444; color: #991b1b; }

        .solution-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 4px solid #22c55e; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #166534; display: none; line-height: 1.5; }
        
        .footer-nav { display: flex; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 15px; }
        .btn-nav { background: #16a34a; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">📖 Chapter-wise Practice Hub (<span id="active-sub-label">Physics</span>)</div>
        <button class="btn-home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
    </header>

    <div class="layout">
        <div class="sidebar">
            <h3>Chapters</h3>
            <div id="chapterListContainer"></div>
        </div>

        <div class="content">
            <div>
                <div class="q-header">
                    <span id="q-chapter-title">Chapter: -</span>
                    <span id="q-counter">Question 0 of 0</span>
                </div>

                <div class="q-text" id="q-text">Select a chapter from the sidebar to start practicing.</div>

                <ul class="options-list" id="options-container">
                    <li id="opt0"></li>
                    <li id="opt1"></li>
                    <li id="opt2"></li>
                    <li id="opt3"></li>
                </ul>

                <div class="solution-box" id="solutionBox">
                    <strong>Explanation:</strong><br><span id="q-explanation"></span>
                </div>
            </div>

            <div class="footer-nav">
                <button class="btn-nav" style="background:#64748b;" onclick="prevQ()">◄ Previous</button>
                <button class="btn-nav" onclick="nextQ()">Next ►</button>
            </div>
        </div>
    </div>

    <script>
        const selectedSubject = localStorage.getItem('active_practice_subject') || 'Physics';
        document.getElementById('active-sub-label').textContent = selectedSubject;

        let chaptersData = (typeof chapterwisePracticeBank !== 'undefined' && chapterwisePracticeBank[selectedSubject]) ? chapterwisePracticeBank[selectedSubject] : {};
        let currentChapter = Object.keys(chaptersData)[0] || "";
        let currentQuestions = currentChapter ? chaptersData[currentChapter] : [];
        let currentIndex = 0;
        let answeredState = false;

        function loadSidebar() {
            let container = document.getElementById('chapterListContainer');
            container.innerHTML = "";
            Object.keys(chaptersData).forEach(chapName => {
                let btn = document.createElement('button');
                btn.className = `chapter-btn ${chapName === currentChapter ? 'active' : ''}`;
                btn.textContent = `${chapName} (${chaptersData[chapName].length})`;
                btn.onclick = () => selectChapter(chapName, btn);
                container.appendChild(btn);
            });
        }

        function selectChapter(chapName, btnElement) {
            document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            currentChapter = chapName;
            currentQuestions = chaptersData[chapName] || [];
            currentIndex = 0;
            loadPracticeQuestion();
        }

        function loadPracticeQuestion() {
            if (currentQuestions.length === 0) {
                document.getElementById('q-text').textContent = "No questions added for this chapter yet.";
                document.getElementById('options-container').innerHTML = "";
                document.getElementById('solutionBox').style.display = "none";
                document.getElementById('q-counter').textContent = "0 of 0";
                document.getElementById('q-chapter-title').textContent = `Chapter: ${currentChapter}`;
                return;
            }

            if (currentIndex >= currentQuestions.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentQuestions.length - 1;

            let q = currentQuestions[currentIndex];
            document.getElementById('q-chapter-title').textContent = `Chapter: ${currentChapter}`;
            document.getElementById('q-counter').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            document.getElementById('q-text').textContent = q.q;

            let optList = document.getElementById('options-container');
            optList.innerHTML = "";
            answeredState = false;
            document.getElementById('solutionBox').style.display = "none";

            q.options.forEach((optText, i) => {
                let li = document.createElement('li');
                li.id = `opt${i}`;
                li.textContent = optText;
                li.onclick = () => checkAnswer(i, q.correct);
                optList.appendChild(li);
            });
        }

        function checkAnswer(selectedIdx, correctIdx) {
            if (answeredState) return;
            answeredState = true;

            for (let i = 0; i < 4; i++) {
                let li = document.getElementById(`opt${i}`);
                if (i === correctIdx) li.classList.add('correct-ans');
                else if (i === selectedIdx) li.classList.add('wrong-ans');
            }

            document.getElementById('q-explanation').textContent = currentQuestions[currentIndex].explanation || "Detailed solution available.";
            document.getElementById('solutionBox').style.display = "block";
        }

        function nextQ() { currentIndex++; loadPracticeQuestion(); }
        function prevQ() { currentIndex--; loadPracticeQuestion(); }

        loadSidebar();
        loadPracticeQuestion();
    </script>
</body>
</html>
