<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Chapter - Practice Hub</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }

        header { background: #ffffff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 16px; font-weight: bold; color: #16a34a; }
        .btn-home { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .layout { max-width: 600px; margin: 50px auto; width: 100%; padding: 0 20px; flex: 1; }

        .selector-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .selector-card h2 { margin-top: 0; font-size: 20px; color: #0f172a; margin-bottom: 8px; }
        .selector-card p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .select-group { margin-bottom: 20px; }
        .select-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
        .select-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; font-weight: 600; outline: none; }

        .btn-start { background: #16a34a; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; transition: background 0.2s; text-align: center; }
        .btn-start:hover { background: #15803d; }
    </style>
</head>
<body>

    <header>
        <div class="logo">📖 Subject: <span id="active-sub-label">Physics</span></div>
        <button class="btn-home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
    </header>

    <div class="layout">
        <div class="selector-card">
            <h2>Select Chapter</h2>
            <p>Choose a specific chapter from the syllabus below to launch your interactive practice session.</p>
            
            <div class="select-group">
                <label for="chapterDropdown">Available Chapters:</label>
                <select id="chapterDropdown">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <button class="btn-start" onclick="launchPracticeTest()">Start Chapter Practice ➔</button>
        </div>
    </div>

    <script>
        const selectedSubject = localStorage.getItem('active_practice_subject') || 'Physics';
        document.getElementById('active-sub-label').textContent = selectedSubject;

        let chaptersData = (typeof chapterwisePracticeBank !== 'undefined' && chapterwisePracticeBank[selectedSubject]) ? chapterwisePracticeBank[selectedSubject] : {};
        let chapterNames = Object.keys(chaptersData);

        function initDropdown() {
            let dropdown = document.getElementById('chapterDropdown');
            dropdown.innerHTML = "";

            if (chapterNames.length === 0) {
                let opt = document.createElement('option');
                opt.text = "No chapters found for this subject";
                dropdown.add(opt);
                return;
            }

            chapterNames.forEach(chapName => {
                let opt = document.createElement('option');
                opt.value = chapName;
                opt.textContent = `${chapName} (${chaptersData[chapName].length} Questions)`;
                dropdown.add(opt);
            });
        }

        function launchPracticeTest() {
            let dropdown = document.getElementById('chapterDropdown');
            let selectedChapter = dropdown.value;
            
            if (!selectedChapter) {
                alert("Please select a valid chapter.");
                return;
            }

            // Save active chapter and go to the question player page
            localStorage.setItem('active_practice_chapter', selectedChapter);
            window.location.href = 'practice-test.html';
        }

        initDropdown();
    </script>
</body>
</html>
