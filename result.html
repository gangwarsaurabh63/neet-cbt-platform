<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Exam Scorecard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #003366; text-align: center; margin-top: 0; }
        .student-info {
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .score-box {
            text-align: center;
            background: #003366;
            color: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .score-box h3 { margin: 0; font-size: 32px; }
        
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .sub-card {
            background: #fdfdfd;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .sub-card h4 { margin: 0 0 10px 0; color: #003366; }
        .sub-score { font-size: 18px; font-weight: bold; color: #28a745; }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-review { background-color: #6f42c1; color: white; }
        .btn-home { background-color: #003366; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEET Mock Test - Scorecard</h1>
        
        <div class="student-info">
            <div><strong>Candidate:</strong> <span id="res-name">Student</span></div>
            <div><strong>Roll No:</strong> <span id="res-roll">N/A</span></div>
        </div>

        <div class="score-box">
            <p style="margin:0 0 5px 0; font-size: 14px;">Total Score Achieved</p>
            <h3 id="total-score">0 / 720</h3>
        </div>

        <h2>Subject-Wise Performance</h2>
        <div class="subject-grid">
            <div class="sub-card">
                <h4>Physics</h4>
                <div class="sub-score" id="score-physics">0 / 180</div>
            </div>
            <div class="sub-card">
                <h4>Chemistry</h4>
                <div class="sub-score" id="score-chemistry">0 / 180</div>
            </div>
            <div class="sub-card">
                <h4>Botany</h4>
                <div class="sub-score" id="score-botany">0 / 180</div>
            </div>
            <div class="sub-card">
                <h4>Zoology</h4>
                <div class="sub-score" id="score-zoology">0 / 180</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-review" onclick="window.location.href='review.html'">View Detailed Solutions</button>
            <button class="btn-home" onclick="window.location.href='index.html'">Back to Home</button>
        </div>
    </div>

    <script>
        document.getElementById('res-name').textContent = localStorage.getItem('neet_candidate_name') || "Candidate";
        document.getElementById('res-roll').textContent = localStorage.getItem('neet_candidate_roll') || "N/A";

        const urlParams = new URLSearchParams(window.location.search);
        const finalScore = urlParams.get('score') || 0;
        document.getElementById('total-score').textContent = `${finalScore} / 720`;

        const subScores = JSON.parse(localStorage.getItem('neet_sub_scores')) || { Physics: 0, Chemistry: 0, Botany: 0, Zoology: 0 };
        document.getElementById('score-physics').textContent = `${subScores.Physics} / 180`;
        document.getElementById('score-chemistry').textContent = `${subScores.Chemistry} / 180`;
        document.getElementById('score-botany').textContent = `${subScores.Botany} / 180`;
        document.getElementById('score-zoology').textContent = `${subScores.Zoology} / 180`;
    </script>
</body>
</html>
